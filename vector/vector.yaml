# Vector config for the ChooChoo Zeek → Gravwell pipeline.
#
# Tails every *.log file Zeek writes into the shared /zeek-logs volume and
# ships each line, verbatim, over plain TCP to Gravwell's simple_relay
# listener. Zeek's LogAscii::use_json=T (see zeek/local.zeek) means each
# line is already a well-formed JSON document, so no parse-and-re-encode
# step is needed — the `text` codec passes `.message` through unchanged.
#
# To swap Gravwell for another SIEM later: change the `sinks:` block. The
# rest of the pipeline stays. To dual-ship, add a second sink and list it
# alongside `gravwell` in the outputs — sources and transforms are shared.

data_dir: /var/lib/vector

sources:
  zeek:
    type: file
    include:
      - /zeek-logs/*.log
      - /zeek-modbus-logs/*.log   # populated only under the dual profile
    exclude:
      - /zeek-logs/stdout.log
      - /zeek-logs/stderr.log
      - /zeek-logs/reporter.log
      - /zeek-logs/broker.log
      - /zeek-logs/loaded_scripts.log
      - /zeek-logs/packet_filter.log
      - /zeek-logs/stats.log
      - /zeek-modbus-logs/stdout.log
      - /zeek-modbus-logs/stderr.log
      - /zeek-modbus-logs/reporter.log
      - /zeek-modbus-logs/broker.log
      - /zeek-modbus-logs/loaded_scripts.log
      - /zeek-modbus-logs/packet_filter.log
      - /zeek-modbus-logs/stats.log
    read_from: beginning
    # Poll every second so vector sees appends on Docker volume mounts.
    # Without this, vector treats EOF as "done" instead of continuing to tail.
    glob_minimum_cooldown_ms: 1000
    fingerprint:
      strategy: checksum
      lines: 1

sinks:
  gravwell:
    type: socket
    inputs: [zeek]
    mode: tcp
    # Ship to Gravwell's simple_relay ingester container, which forwards
    # to the indexer over :4023 using the shared Ingest-Secret.
    address: simple-relay:7777
    encoding:
      codec: text
    framing:
      method: newline_delimited
    # Buffer to disk so a Gravwell restart / hiccup doesn't drop events.
    buffer:
      type: disk
      max_size: 536870912   # 512 MiB — plenty for a training rig
      when_full: block
