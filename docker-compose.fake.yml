# Hardwareless demo: full stack runs in containers, train backend is FakeTrain.
#
# Pick a control-plane profile:
#
#   docker compose -f docker-compose.fake.yml --profile mqtt   up -d   # MQTT only  → http://localhost:8000
#   docker compose -f docker-compose.fake.yml --profile modbus up -d   # Modbus only → http://localhost:8000
#
# Open http://localhost:8000.
#
# Stack the `attacker` profile to add a Kali container on the same network
# (useful for virtual events with no physical LAN):
#
#   docker compose -f docker-compose.fake.yml --profile mqtt --profile attacker up -d
#   docker exec -it choochoo-attacker bash
#   cat /opt/cheatsheet.md
#
# Stack the `noise` profile to add a fake corporate intranet, an SMB share,
# and a workstation simulator that walks human-paced HTTP/SMB/DNS traffic:
#
#   docker compose -f docker-compose.fake.yml --profile mqtt --profile attacker --profile noise up -d
#
# Stack the `sensor` profile to add a FOSS Zeek instance + a Vector sidecar
# that ships every Zeek log line to Gravwell's simple_relay listener when
# --profile gravwell is also up. No license, no auth token required — see
# zeek/README.md.
#
# Zeek uses network_mode: host and sniffs the named Docker bridge (br-choochoo0)
# so a single instance has full east-west visibility across all containers.
#
# Images are built locally. Build everything for the profiles you're running:
#
#   docker compose -f docker-compose.fake.yml \
#       --profile mqtt --profile attacker --profile noise build
#
# Or build + start in one shot with `up --build`:
#
#   docker compose -f docker-compose.fake.yml \
#       --profile mqtt --profile attacker --profile noise up --build -d

networks:
  choochoo0:
    name: choochoo0
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-choochoo0

services:
  # --- MQTT profile --------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: choochoo-mosquitto-fake
    ports:
      - "1883:1883"   # MQTT — attendees connect here from the LAN
      - "9001:9001"   # WebSocket MQTT — browser-based tooling
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data-fake:/mosquitto/data
    networks: [choochoo0]
    profiles: [mqtt]
    restart: unless-stopped
    security_opt: [apparmor:unconfined]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  switch-controller-mqtt:
    image: choochoo:dev
    build:
      context: .
    container_name: choochoo-switch-controller-mqtt
    command: ["-v", "switch-controller"]
    environment:
      CHOOCHOO_BROKER: ${MQTT_BROKER_HOST:-mosquitto}
      CHOOCHOO_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      CHOOCHOO_SWITCH_ID: sw1
      CHOOCHOO_SWITCH_KIND: fake
    depends_on:
      - mosquitto
    networks: [choochoo0]
    profiles: [mqtt]
    restart: unless-stopped
    security_opt: [apparmor:unconfined]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Legacy MQTT-flavored web UI. Not part of the ChooChoo event configuration
  # (the event runs Modbus for the train). Kept for demonstrating the V-series
  # IoT vulnerabilities against the MQTT train controller.
  web-mqtt:
    image: choochoo:dev
    build:
      context: .
    container_name: choochoo-web-mqtt
    ports:
      - "8000:8000"
    command: ["web", "--http-port", "8000"]
    environment:
      CHOOCHOO_PROTOCOL: mqtt
      CHOOCHOO_TRAIN_ID: t1
      CHOOCHOO_BROKER: ${MQTT_BROKER_HOST:-mosquitto}
      CHOOCHOO_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
    depends_on:
      - mosquitto
    networks: [choochoo0]
    profiles: [mqtt]
    restart: unless-stopped
    security_opt: [apparmor:unconfined]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Modbus profile ------------------------------------------------------
  controller-modbus:
    image: choochoo:dev
    build:
      context: .
    container_name: choochoo-controller-modbus
    hostname: controller
    command: ["controller"]
    environment:
      CHOOCHOO_PROTOCOL: modbus
      CHOOCHOO_TRAIN: fake
      CHOOCHOO_TRAIN_ID: t1
      # Outstation also mediates the track switch (M10). Points its
      # MQTT client at the switch broker; only takes effect when
      # --profile mqtt is also active.
      CHOOCHOO_SWITCH_BROKER: ${MQTT_BROKER_HOST:-mosquitto}
      CHOOCHOO_SWITCH_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      CHOOCHOO_SWITCH_ID: sw1
    ports:
      - "5020:5020"
    networks: [choochoo0]
    profiles: [modbus, dual]
    restart: unless-stopped
    security_opt: [apparmor:unconfined]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  web-modbus:
    image: choochoo:dev
    build:
      context: .
    container_name: choochoo-web-modbus
    ports:
      - "${MODBUS_WEB_PORT:-8000}:8000"
    command: ["web", "--http-port", "8000"]
    environment:
      CHOOCHOO_PROTOCOL: modbus
      CHOOCHOO_TRAIN_ID: t1
      CHOOCHOO_BROKER: ${MODBUS_CONTROLLER_HOST:-controller}
      CHOOCHOO_MODBUS_PORT: ${MODBUS_CONTROLLER_PORT:-5020}
      # The switch is MQTT-only; point its bridge at the broker regardless
      # of the train protocol. Only used when --profile mqtt is also active.
      CHOOCHOO_SWITCH_BROKER: ${MQTT_BROKER_HOST:-mosquitto}
      CHOOCHOO_SWITCH_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      CHOOCHOO_SWITCH_ID: sw1
    depends_on:
      - controller-modbus
    networks: [choochoo0]
    profiles: [modbus, dual]
    restart: unless-stopped
    security_opt: [apparmor:unconfined]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Kali attacker (stack with either profile) --------------------------
  # Run with: --profile attacker (combine with --profile mqtt|modbus).
  # Trainee shells in via `docker exec -it choochoo-attacker bash`.
  attacker:
    image: choochoo-attacker:dev
    build:
      context: ./attacker
    container_name: choochoo-attacker
    hostname: attacker
    # Deliberately no mount of the host repo. Trainees should discover the
    # attack surface from the wire — names, protocols, point maps, the
    # cheat code that is the discovery beacon — not by reading the source.
    # The trainer keeps the source-of-truth (`attacker/SOLUTIONS.md`,
    # `VULNERABILITIES.md`) on the host as the answer key.
    profiles: [attacker]
    # nmap raw-packet scans (-sS, -O) and tcpdump need NET_RAW; without it
    # `nmap` exits with "Operation not permitted" under Docker Desktop's
    # default seccomp profile.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt: [apparmor:unconfined]
    networks: [choochoo0]
    # No published ports — the attacker is *inside* the network, not
    # reachable from outside. That mirrors a LAN-side adversary.
    restart: unless-stopped

  # --- Background traffic (stack with either control plane) ---------------
  # `noise` profile: fake intranet + SMB share + a workstation that walks a
  # weighted random schedule of HTTP/SMB/DNS/dashboard traffic. Gives Zeek a
  # realistic baseline so the attacker's MQTT/Modbus probes have something
  # to stand out against.
  intranet:
    image: nginx:1.27-alpine
    container_name: choochoo-intranet
    hostname: intranet
    volumes:
      - ./noise/intranet/index.html:/usr/share/nginx/html/index.html:ro
      - ./noise/intranet/status:/usr/share/nginx/html/status:ro
      - ./noise/intranet/reports:/usr/share/nginx/html/reports:ro
      - ./noise/intranet/files:/usr/share/nginx/html/files:ro
      - ./noise/intranet/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks: [choochoo0]
    profiles: [noise]
    restart: unless-stopped

  fileshare:
    # samba/server is a small, well-known SMB server image. We mount the
    # share read-only and allow guest access — no auth, on purpose, so
    # the user simulator can list/read without credentials.
    image: dperson/samba
    container_name: choochoo-fileshare
    hostname: fileshare
    command: >
      -p
      -s "section7;/share;yes;yes;yes;all;none;all;Section 7 docs"
    volumes:
      - ./noise/share:/share:ro
    expose:
      - "139"
      - "445"
    networks: [choochoo0]
    profiles: [noise]
    restart: unless-stopped

  user:
    image: choochoo-user:dev
    build:
      context: ./noise/user
    container_name: choochoo-user
    hostname: workstation
    environment:
      # The simulator picks whichever dashboard host is up. With the mqtt
      # profile this is web-mqtt; with modbus, override via .env or compose
      # `up` env (`CHOOCHOO_DASHBOARD=http://web-modbus:8000`).
      CHOOCHOO_DASHBOARD: ${CHOOCHOO_DASHBOARD:-http://${WEB_MQTT_HOST:-web-mqtt}:8000}
      CHOOCHOO_INTRANET: http://intranet
      CHOOCHOO_FILESHARE_HOST: fileshare
      CHOOCHOO_FILESHARE_NAME: section7
    depends_on:
      - intranet
      - fileshare
    networks: [choochoo0]
    profiles: [noise]
    restart: unless-stopped

  # --- Zeek (FOSS NSM) + Vector shipper -----------------------------------
  # `sensor` profile. Single Zeek instance running on the host network stack
  # so it can sniff the named Docker bridge (br-choochoo0). This gives full
  # east-west visibility across all containers — MQTT, Modbus, HTTP — without
  # per-protocol container proliferation. Logs land in zeek-logs, which the
  # Vector sidecar ships to Gravwell.
  #
  # network_mode: host means the Zeek container sees all host interfaces,
  # including br-choochoo0. The interface name is predictable because we
  # define the network with name: choochoo0 above.
  zeek:
    image: choochoo-zeek:dev
    build:
      context: ./zeek
    container_name: choochoo-zeek
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt: [apparmor:unconfined]
    volumes:
      - zeek-logs:/logs
    environment:
      # NIC to sniff. br-choochoo0 = Docker bridge (single-host default).
      # Override to eth0 or the SPAN NIC name for physical multi-Pi deployments.
      ZEEK_IFACE: ${ZEEK_IFACE:-br-choochoo0}
      # IP of the legitimate Modbus master (web-modbus). Writes from other IPs
      # get authorized=F. Leave unset if running without Modbus.
      MODBUS_MASTER_IP: ${MODBUS_MASTER_IP:-}
      # IP of the legitimate MQTT publisher (web-mqtt). Publishes from other IPs
      # fire UnauthorizedPublish. Leave unset if running without MQTT.
      MQTT_PUBLISHER_IP: ${MQTT_PUBLISHER_IP:-}
    profiles: [sensor]
    restart: unless-stopped

  vector:
    image: timberio/vector:0.49.0-alpine
    container_name: choochoo-vector
    hostname: vector
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - zeek-logs:/zeek-logs:ro
      - vector-data:/var/lib/vector
    command: ["--config", "/etc/vector/vector.yaml"]
    networks: [choochoo0]
    security_opt: [apparmor:unconfined]
    profiles: [sensor]
    restart: unless-stopped

  # --- Gravwell SIEM (defender side) ---------------------------------------
  # `gravwell` profile. Single-container Community Edition: Zeek logs
  # arrive via the Vector sidecar (--profile sensor) into a simple_relay
  # listener tagged `zeek`. Search at http://localhost:8080.
  #
  # Default admin creds on first start: admin / changeme. Change them, then
  # the trainer/defender pivots to building Gravwell queries against the
  # `tag=zeek` well to demonstrate detection of the MQTT/Modbus abuses
  # catalogued in VULNERABILITIES.md.
  #
  # License and EULA are accepted via the web UI on first access — no
  # host-side file drop required. The license persists in the
  # `gravwell-storage` volume across restarts.
  #
  # The base image runs only the webserver + indexer. Ingesters are
  # separate containers that connect to :4023 — see `simple_relay` below.
  gravwell:
    image: choochoo-gravwell:dev
    build:
      context: ./gravwell
    container_name: choochoo-gravwell
    hostname: gravwell
    ports:
      - "8080:80"          # web UI
    expose:
      - "4023"             # cleartext ingester backend (simple_relay → gravwell)
    volumes:
      - gravwell-storage:/opt/gravwell/storage
      - gravwell-log:/opt/gravwell/log
    networks: [choochoo0]
    profiles: [gravwell]
    security_opt: [apparmor:unconfined]
    restart: unless-stopped

  # Gravwell's line-delimited JSON ingester. Runs as its own container per
  # Gravwell's recommended pattern; connects to `gravwell:4023` using the
  # shared Ingest-Secret from simple_relay.conf.
  simple-relay:
    image: gravwell/simple_relay:latest
    container_name: choochoo-simple-relay
    hostname: simple-relay
    expose:
      - "7777"             # line-JSON listener (vector → simple-relay)
    # simple_relay stamps an ingester UUID into its config on first run via
    # an atomic rename, which fails on a bind-mounted file. Mount to a
    # side path and copy it into place before letting the manager start.
    volumes:
      - ./gravwell/config/simple_relay.conf:/etc/simple_relay.conf.seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp -f /etc/simple_relay.conf.seed /opt/gravwell/etc/simple_relay.conf &&
        exec /opt/gravwell/bin/manager
    depends_on:
      - gravwell
    networks: [choochoo0]
    profiles: [gravwell]
    security_opt: [apparmor:unconfined]
    restart: unless-stopped

  # --- Admin panel (always-on operator controls) --------------------------
  # Password-protected panel at http://<host>:9999 for event operators.
  # Provides: per-container restart/rebuild, full stack teardown+rebuild,
  # and IP blocking via iptables DOCKER-USER chain.
  #
  # SECURITY: Change ADMIN_PASSWORD before running at a public event.
  # The panel is on a non-guessable port and requires HTTP Basic Auth, but
  # it has full docker socket + iptables access — treat it like root.
  #
  # network_mode: host + NET_ADMIN are required for iptables to reach the
  # DOCKER-USER chain. The COMPOSE_FILE path is the in-container path to
  # the compose file (bind-mounted from the project root).
  admin:
    image: choochoo-admin:dev
    build:
      context: ./admin
    container_name: choochoo-admin
    # network_mode: host + NET_ADMIN required for iptables DOCKER-USER access on Linux.
    # ports: is ignored on Linux host-mode but makes the panel reachable on Docker Desktop
    # (Mac/Windows) where host-mode doesn't expose ports automatically.
    network_mode: host
    ports:
      - "9999:9999"
    cap_add:
      - NET_ADMIN
    security_opt: [apparmor:unconfined]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/compose:ro
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-choochoo-admin}
      COMPOSE_FILE: /compose/docker-compose.fake.yml
      # Comma-separated profiles that were used to bring the stack up.
      # Used by rebuild/per-service restart so compose knows which services exist.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-mqtt,sensor,gravwell}
      # Which choochoo web container to proxy train/switch commands through.
      # Use http://choochoo-web-mqtt:8000 when running the mqtt-only profile.
      # host network mode means container names don't resolve — use localhost + mapped port.
      # Train (Modbus) is web-modbus on :8001; switch (MQTT) is web-mqtt on :8000.
      TRAIN_API_URL: ${TRAIN_API_URL:-http://localhost:8001}
      SWITCH_API_URL: ${SWITCH_API_URL:-http://localhost:8000}
    profiles: [admin]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mosquitto-data-fake:
  zeek-logs:
  vector-data:
  gravwell-storage:
  gravwell-log:
