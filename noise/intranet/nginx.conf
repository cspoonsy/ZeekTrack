server {
    listen 80;
    server_name intranet;

    root /usr/share/nginx/html;
    index index.html;

    # Allow directory browsing of /reports and /files so the user simulator
    # (and any curious trainee) can list what's there.
    location /reports/ { autoindex on; autoindex_format html; }
    location /files/   { autoindex on; autoindex_format html; }

    location /status {
        default_type application/json;
        try_files /status =404;
    }

    # Mild access logging — Zeek will see the requests anyway, but having
    # them in the container log helps the trainer post-mortem.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
