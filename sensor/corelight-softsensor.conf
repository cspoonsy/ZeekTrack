# ChooChoo training-exercise default Microsensor config.
#
# This is a *minimal starting point*: sniff one interface, write logs to
# /var/corelight/logs, no external exporters. The packaged
# /etc/corelight-softsensor.conf.example is the fully-commented reference;
# look there to enable Splunk HEC, Kafka, JSON-over-TCP, Syslog, S3, etc.
#
# Restart the container after editing this file:
#   docker compose -f docker-compose.fake.yml restart sensor

# --- System ----------------------------------------------------------------
Corelight::system_name         choochoo-sensor

# Sniff the container's primary network interface. eth0 is the standard
# name for the first interface in a bridge-networked Docker container.
# eth0~2 = two Zeek workers on eth0; tune up if the host has spare cores
# and traffic warrants it.
Corelight::sniff               eth0~2

# Logs land here; the container declares /var/corelight as a volume, so
# logs survive restarts if the volume is persisted.
Corelight::disk_space          /var/corelight

# Allow the sensor to phone home with anonymous run statistics. Disable
# (F) for fully air-gapped deployments.
Corelight_Cloud::share_stats   T

# Local network ranges. Adjust to match your training LAN — anything not
# in here is treated as "external" by Zeek.
Site::local_nets               172.16.0.0/12,10.0.0.0/8,192.168.0.0/16

# --- Streaming exporters (off by default) ----------------------------------
#
# Uncomment a block below + set the destination to wire logs into a SIEM.
# All blocks follow the same pattern: enable + server[:port] + per-exporter
# tuning. See Corelight Microsensor User Guide section 4.6.8 for the full
# option list.

# JSON over TCP — wired to the Gravwell `simple_relay` listener when the
# `gravwell` compose profile is up. The hostname `gravwell` resolves on
# the compose network; the port matches gravwell/config/simple_relay.conf.
# Comment these out (or change the server) to disable / redirect.
Corelight::json_enable          T
Corelight::json_server          gravwell:7777

# Syslog (RFC5424 octet framing is the most common modern variant).
# Corelight::syslog_enable      T
# Corelight::syslog_server      syslog.local
# Corelight::syslog_format      rfc5424_octet_framing

# Splunk HEC — set the URL and a HEC token.
# Splunk::enable                T
# Splunk::hec_url               https://splunk.local:8088
# Splunk::hec_token             <hec-token>

# --- Suricata --------------------------------------------------------------
# Off by default; enable + add rule files to /etc/corelight/rules/ to use.
# Suricata::enable              T
# Suricata::rule_path           /etc/corelight/rules/
# Suricata::rule_files          *.rules
