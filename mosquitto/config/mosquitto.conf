# Permissive config for the "baseline / undefended" stage of the exercise.
# No auth, no TLS, no ACLs — anything on the LAN can publish/subscribe.
# Hardening stages (passwords, ACLs, TLS) will layer on top of this later.

listener 1883
allow_anonymous true

# Websockets listener — handy if the attacker tooling is browser-based.
listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
