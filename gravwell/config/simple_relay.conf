; Gravwell simple_relay config — listens for line-delimited JSON from the
; Corelight softsensor's JSON-over-TCP exporter and tags each Zeek log
; stream so it lands in a recognizable Gravwell well.
;
; Softsensor sends one JSON document per line; simple_relay's
; "Reader-Type=line" handles that natively.
;
; Drop a Listener block per Zeek log type so each gets its own tag.
; The softsensor's JSON exporter doesn't multiplex per-log on different
; ports, so we send everything to one listener tagged `zeek` and let
; the trainee filter by `_path` field at search time. Add per-log
; listeners later if you want hard separation.

[Global]
# Must match the Ingest-Secret on the Gravwell indexer (defaults to
# "IngestSecrets" on a fresh container — change both sides in tandem
# for a real deployment).
Ingest-Secret = "IngestSecrets"
Connection-Timeout = 0
Insecure-Skip-TLS-Verify = false
# `gravwell` = the indexer container's hostname on the compose network;
# 4023 = its cleartext ingester port.
Cleartext-Backend-Target=gravwell:4023
Log-Level=INFO
Log-File="/opt/gravwell/log/simple_relay.log"

[Listener "zeek-json"]
	Bind-String="0.0.0.0:7777"
	Tag-Name=zeek
	Reader-Type=line
	Assume-Local-Timezone=true
	Keep-Priority=false
